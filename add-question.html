<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thêm câu hỏi</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

header{

background:#0057ff;
color:white;
padding:20px;
text-align:center;

}

.container{

max-width:1000px;
margin:30px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);

}

h2{

margin-bottom:20px;
color:#0057ff;

}

label{

display:block;
margin-top:20px;
margin-bottom:8px;
font-weight:bold;

}

input,
select,
textarea{

width:100%;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;

}

textarea{

min-height:120px;

}

.row{

display:grid;
grid-template-columns:1fr 1fr;
gap:20px;

}

button{

margin-top:30px;
background:#0057ff;
color:white;
padding:15px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;

}

button:hover{

background:#0044cc;

}

.back{

display:inline-block;
margin-bottom:20px;
text-decoration:none;
color:#0057ff;
font-weight:bold;

}

.back:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<header>

<h1>➕ Thêm câu hỏi mới</h1>

<p>Ngân hàng đề thi Thầy Hoàng MpC</p>

</header>

<div class="container">

<a class="back" href="admin.html">
← Quay về trang quản trị
</a>

<h2>Thông tin câu hỏi</h2>

<div class="row">

<div>

<label>Kỳ thi</label>

<select id="exam">

<option>THPT</option>

<option>ĐGNL</option>

<option>Tuyển sinh 10</option>

<option>Kiểm tra định kỳ</option>

</select>

</div>

<div>

<label>Ngân hàng</label>

<select id="bank">

<option>1000 Câu Dễ Sai Nhất</option>

<option>500 Đề thi thử</option>

<option>250 Đề phát triển chuẩn BGD</option>

</select>

</div>

</div>

<div class="row">

<div>

<label>Chuyên đề</label>

<select id="chapter">

<option>Hàm số 12</option>

<option>Thống kê 12</option>

<option>Tích phân 12</option>

<option>Tọa độ Oxyz 12</option>

<option>Xác suất 10-12</option>

<option>Kiến thức 10+11</option>

</select>

</div>

<div>

<label>Bài học</label>

<select id="lesson">

<option>Đồng biến - Nghịch biến</option>

<option>Cực trị</option>

<option>Tiệm cận</option>

<option>Đồ thị</option>

<option>Tiếp tuyến</option>

<option>Tổng hợp</option>

</select>

</div>

</div>

<div class="row">

<div>

<label>Mức độ</label>

<select id="level">

<option>🟢 Dễ</option>

<option>🟡 Trung bình</option>

<option>🔴 Khó</option>

</select>

</div>

<div>

<label>Đáp án đúng</label>

<select id="answer">

<option>A</option>

<option>B</option>

<option>C</option>

<option>D</option>

</select>

</div>

</div>

<label>Câu hỏi</label>

<textarea id="question"></textarea>

<label>Đáp án A</label>

<input id="A">

<label>Đáp án B</label>

<input id="B">

<label>Đáp án C</label>

<input id="C">

<label>Đáp án D</label>

<input id="D">

<label>Lời giải</label>

<textarea id="solution"></textarea>

<button id="saveBtn">

💾 Lưu câu hỏi

</button>

</div>
</div>

<!-- CKEditor -->
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

/* Firebase */

const firebaseConfig={

apiKey:"AIzaSyAn5qW3LKUyEAgGBd0Yb8T4_ZoBujQKFbY",

authDomain:"thidiemcao-4097d.firebaseapp.com",

projectId:"thidiemcao-4097d",

storageBucket:"thidiemcao-4097d.firebasestorage.app",

messagingSenderId:"333180855649",

appId:"1:333180855649:web:e46ce1e15a715b3f0c5120"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

/* CKEditor */

let editorQuestion;

let editorSolution;

ClassicEditor
.create(document.querySelector("#question"))
.then(editor=>{

editorQuestion=editor;

})
.catch(error=>{

console.error(error);

});

ClassicEditor
.create(document.querySelector("#solution"))
.then(editor=>{

editorSolution=editor;

})
.catch(error=>{

console.error(error);

});
  /* ===========================
   LƯU CÂU HỎI LÊN FIRESTORE
=========================== */

document.getElementById("saveBtn").onclick = async function(){

const exam = document.getElementById("exam").value;
const bank = document.getElementById("bank").value;
const chapter = document.getElementById("chapter").value;
const lesson = document.getElementById("lesson").value;
const level = document.getElementById("level").value;

const question = editorQuestion.getData();

const A = document.getElementById("A").value.trim();
const B = document.getElementById("B").value.trim();
const C = document.getElementById("C").value.trim();
const D = document.getElementById("D").value.trim();

const answer = document.getElementById("answer").value;

const solution = editorSolution.getData();

/* Kiểm tra dữ liệu */

if(question==""){

alert("Vui lòng nhập câu hỏi.");

return;

}

if(A==""||B==""||C==""||D==""){

alert("Vui lòng nhập đủ 4 đáp án.");

return;

}

try{

await addDoc(collection(db,"questions"),{

exam,

bank,

chapter,

lesson,

level,

question,

A,

B,

C,

D,

answer,

solution,

createdAt:new Date()

});

alert("✅ Đã lưu câu hỏi thành công!");

editorQuestion.setData("");

editorSolution.setData("");

document.getElementById("A").value="";
document.getElementById("B").value="";
document.getElementById("C").value="";
document.getElementById("D").value="";

document.getElementById("answer").selectedIndex=0;

}catch(error){

console.error(error);

alert("❌ Lỗi khi lưu dữ liệu!");

}

}

</script>

</body>
</html>
