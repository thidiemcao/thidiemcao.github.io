<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thêm câu hỏi</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
margin:0;
}

header{
background:#0057ff;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:30px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

input, textarea, select{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
background:#0057ff;
color:white;
padding:12px 25px;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0044cc;
}

</style>
</head>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyAn5qW3LKUyEAgGBd0Yb8T4_ZoBujQKFbY",

authDomain: "thidiemcao-4097d.firebaseapp.com",

projectId: "thidiemcao-4097d",

storageBucket: "thidiemcao-4097d.firebasestorage.app",

messagingSenderId: "333180855649",

appId: "1:333180855649:web:e46ce1e15a715b3f0c5120"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.db = db;
window.addDoc = addDoc;
window.collection = collection;

</script>
<body>

<header>
<h1>➕ Thêm câu hỏi</h1>
</header>

<div class="container">
<label>Kỳ thi</label>

<select id="exam">

<option>THPT</option>

<option>ĐGNL</option>

<option>Tuyển sinh 10</option>

<option>Kiểm tra định kỳ</option>

</select>


<label>Ngân hàng câu hỏi</label>

<select id="bank">

<option>1000 Câu Dễ Sai Nhất</option>

<option>500 Đề thi thử</option>

<option>250 Đề phát triển chuẩn BGD</option>

</select>


<label>Chuyên đề</label>

<select id="chapter">

<option>Hàm số 12</option>

<option>Thống kê 12</option>

<option>Tích phân 12</option>

<option>Tọa độ Oxyz 12</option>

<option>Xác suất 10-12</option>

<option>Kiến thức 10+11</option>

</select>


<label>Bài học</label>

<select id="lesson">

<option>Đồng biến - Nghịch biến</option>

<option>Cực trị</option>

<option>Tiệm cận</option>

<option>Đồ thị</option>

<option>Tiếp tuyến</option>

<option>Tổng hợp</option>

</select>


<label>Mức độ</label>

<select id="level">

<option>🟢 Dễ</option>

<option>🟡 Trung bình</option>

<option>🔴 Khó</option>

</select>
<textarea id="question" rows="4" placeholder="Nhập câu hỏi"></textarea>

<input id="A" placeholder="Đáp án A">
<input id="B" placeholder="Đáp án B">
<input id="C" placeholder="Đáp án C">
<input id="D" placeholder="Đáp án D">

<select id="answer">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
</select>

<textarea id="solution" rows="4" placeholder="Lời giải"></textarea>

<button>
Lưu câu hỏi
</button>

</div>

</body>
</html>
