<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng nhập</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#fff;
padding:40px;
width:360px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0057ff;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0044cc;
}
</style>
</head>

<body>

<div class="box">

<h2>Đăng nhập</h2>

<input type="text" id="name" placeholder="Họ và tên">

<input type="tel" id="phone" placeholder="Số điện thoại">

<button onclick="login()">Tiếp tục</button>

</div>

<script>

function login(){

let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();

if(name==""||phone==""){
alert("Vui lòng nhập đầy đủ thông tin.");
return;
}

localStorage.setItem("studentName",name);
localStorage.setItem("studentPhone",phone);

window.location.href="index.html";

}

</script>

</body>
</html>
