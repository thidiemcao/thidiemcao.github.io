<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng nhập</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#fff;
padding:40px;
width:360px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0057ff;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0044cc;
}
</style>
</head>

<body>

<div class="box">

<h2>Đăng nhập</h2>

<input type="text" id="name" placeholder="Họ và tên">

<input type="tel" id="phone" placeholder="Số điện thoại">

<button onclick="login()">Tiếp tục</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAn5qW3LKUyEAgGBd0Yb8T4_ZoBujQKFbY",
  authDomain: "thidiemcao-4097d.firebaseapp.com",
  projectId: "thidiemcao-4097d",
  storageBucket: "thidiemcao-4097d.firebasestorage.app",
  messagingSenderId: "333180855649",
  appId: "1:333180855649:web:e46ce1e15a715b3f0c5120",
  measurementId: "G-5VNE2ENWXP"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.login = async function(){

  let name = document.getElementById("name").value.trim();
  let phone = document.getElementById("phone").value.trim();

  if(name=="" || phone==""){
    alert("Vui lòng nhập đầy đủ thông tin.");
    return;
  }

  try{

    await setDoc(
    doc(db,"hoc_sinh",phone),
    {

        ten:name,

        sdt:phone,

        time:new Date().toISOString()

    },
    {

        merge:true

    }
);

    localStorage.setItem("studentName",name);
    localStorage.setItem("studentPhone",phone);

    alert("Đăng nhập thành công!");

    window.location.href="index.html";

  }catch(err){

    console.error(err);
    alert("Không thể kết nối Firebase!");

  }

}

</script>
</body>
</html>
