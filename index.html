<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thi ĐIỂM CAO cùng Thầy Hoàng MpC</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
}

header{
    background:#0057ff;
    color:white;
    padding:18px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:42px;
}

.hero p{
    color:#555;
    font-size:20px;
}

button{
    background:#0057ff;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
}

.cards{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    padding:40px;
}

.card{
    width:220px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    text-align:center;
}
</style>

</head>

<body>

<header>
🎓 DiemCao
</header>

<div class="hero">
<h1>Thi thử như thi thật</h1>
<p>Thực chiến đề thi thử THPT • ĐGNL • Kiểm tra định kỳ Toán THPT</p>

<button>Bắt đầu</button>
</div>

<div class="cards">

<div class="card">
<h2>THPT</h2>
<p>Thi tốt nghiệp</p>
</div>

<div class="card">
<h2>ĐGNL</h2>
<p>Đánh giá năng lực</p>
</div>

<div class="card">
<h2>10-11-12</h2>
<p>Kiểm tra định kỳ</p>
</div>

</div>

</body>
</html>
