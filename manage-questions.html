<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quản lý câu hỏi</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#0057ff;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1200px;
margin:30px auto;
padding:20px;
}

.filter{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:25px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

select,input{
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
background:#0057ff;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#0044cc;
}

table{
width:100%;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

th{
background:#0057ff;
color:white;
padding:15px;
}

td{
padding:15px;
border-bottom:1px solid #eee;
}

.action button{
margin-right:5px;
padding:8px 12px;
}

</style>

</head>

<body>

<header>

<h1>📚 Quản lý câu hỏi</h1>

</header>

<div class="container">

<div class="filter">

<select id="exam">
<option value="">Tất cả kỳ thi</option>
<option>THPT</option>
<option>ĐGNL</option>
<option>Tuyển sinh 10</option>
<option>Kiểm tra định kỳ</option>
</select>

<select id="chapter">
<option value="">Tất cả chuyên đề</option>
<option>Hàm số 12</option>
<option>Tích phân 12</option>
<option>Oxyz 12</option>
<option>Thống kê 12</option>
<option>Xác suất</option>
</select>

<input id="keyword" placeholder="Tìm kiếm câu hỏi...">

<button id="searchBtn">
Tìm kiếm
</button>

</div>

<table>

<thead>

<tr>

<th>STT</th>

<th>Câu hỏi</th>

<th>Chuyên đề</th>

<th>Mức độ</th>

<th>Thao tác</th>

</tr>

</thead>

<tbody id="questionTable">

</tbody>

</table>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
getDoc,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyAn5qW3LKUyEAgGBd0Yb8T4_ZoBujQKFbY",

authDomain: "thidiemcao-4097d.firebaseapp.com",

projectId: "thidiemcao-4097d",

storageBucket: "thidiemcao-4097d.firebasestorage.app",

messagingSenderId: "333180855649",

appId: "1:333180855649:web:e46ce1e15a715b3f0c5120"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

loadQuestions();

async function loadQuestions(){

const snapshot = await getDocs(collection(db,"questions"));

let html="";

let stt=1;

snapshot.forEach((item)=>{

const q=item.data();

html+=`
<tr>

<td>${stt++}</td>

<td>${q.question.replace(/<[^>]+>/g,"").substring(0,80)}...</td>
<td>${q.chapter}</td>

<td>${q.level}</td>

<td class="action">

<button onclick="editQuestion('${item.id}')">
✏️
</button>

<button onclick="viewQuestion('${item.id}')">
👁️
</button>

<button onclick="removeQuestion('${item.id}')">
🗑️
</button>

</td>

</tr>
`;

});

document.getElementById("questionTable").innerHTML=html;

}

window.editQuestion=function(id){

location.href="edit-question.html?id="+id;

}
window.viewQuestion = async function(id){

const snap = await getDoc(doc(db,"questions",id));

const q = snap.data();

document.getElementById("popup").style.display = "block";

document.getElementById("popupContent").innerHTML = `

<p><b>Kỳ thi:</b> ${q.exam}</p>

<p><b>Ngân hàng:</b> ${q.bank}</p>

<p><b>Chuyên đề:</b> ${q.chapter}</p>

<hr>

${q.question}

<hr>

<p><b>A.</b> ${q.A}</p>

<p><b>B.</b> ${q.B}</p>

<p><b>C.</b> ${q.C}</p>

<p><b>D.</b> ${q.D}</p>

<hr>

<p><b>Đáp án đúng:</b> ${q.answer}</p>

<hr>

${q.solution}

`;

}

window.closePopup=function(){

document.getElementById("popup").style.display="none";

}
window.removeQuestion=async function(id){

if(!confirm("Xóa câu hỏi này?")) return;

await deleteDoc(doc(db,"questions",id));

alert("Đã xóa!");

loadQuestions();

}

</script>
  <div id="popup" style="
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
">

<div style="
background:white;
width:90%;
max-width:900px;
margin:40px auto;
padding:25px;
border-radius:12px;
max-height:90%;
overflow:auto;
">

<h2>📖 Chi tiết câu hỏi</h2>

<div id="popupContent"></div>

<br>

<button onclick="closePopup()">
Đóng
</button>

</div>

</div>
</body>
</html>
