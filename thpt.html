<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THPT Quốc gia</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f7fb;
}

header{
background:#0057ff;
color:white;
padding:25px;
text-align:center;
}

header h1{
margin:0;
}

.container{
max-width:1000px;
margin:40px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
padding:20px;
}

.card{

background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;

}

.card h2{

font-size:28px;
margin-bottom:20px;

}

.card p{

font-size:18px;
color:#666;
margin-bottom:25px;

}

button{

background:#0057ff;
color:white;
border:none;
padding:14px 28px;
border-radius:8px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#0044cc;

}

.back{

display:block;
text-align:center;
margin:30px;
font-size:18px;

}

</style>

</head>

<body>

<header>

<h1>🎓 Luyện thi THPT</h1>

<p>Chọn ngân hàng đề muốn luyện</p>

</header>

<div class="container">

<div class="card">

<h2>📕 1000 câu SAI NGU</h2>

<p>Ôn tập các lỗi học sinh thường mắc phải.</p>

<button onclick="alert('Đang xây dựng')">
Vào học
</button>

</div>

<div class="card">

<h2>📝 500 đề thi thử</h2>

<p>Đề mới nhất từ các Sở GD&ĐT và trường chuyên.</p>

<button onclick="alert('Đang xây dựng')">
Làm đề
</button>

</div>

<div class="card">

<h2>⭐ 250 đề chuẩn BGD</h2>

<p>Đề phát triển theo cấu trúc mới của Bộ.</p>

<button onclick="alert('Đang xây dựng')">
Làm đề
</button>

</div>

</div>

<a class="back" href="index.html">
⬅ Quay về trang chủ
</a>

</body>
</html>
