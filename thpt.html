<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THPT</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

header{
background:#0057ff;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
}

.card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
text-align:center;
}

.card h2{
margin-bottom:15px;
}

.card p{
margin-bottom:25px;
color:#666;
}

button{
background:#0057ff;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#003ecc;
}

</style>

</head>

<body>

<header>

<h1>🎓 THPT Quốc Gia</h1>

<p>Luyện thi theo từng chuyên đề</p>

</header>

<div class="container">

<div class="grid">

<div class="card">

<h2>❌ 1000 câu SAI NGU</h2>

<p>Luyện từng chuyên đề dễ sai nhất.</p>

<button onclick="location.href='saingu.html'">
Vào học
</button>

</div>

<div class="card">

<h2>📝 500 đề thi thử</h2>

<p>Tổng hợp đề mới nhất từ Sở và trường chuyên.</p>

<button>
Đang cập nhật
</button>

</div>

<div class="card">

<h2>⭐ 250 đề phát triển BGD</h2>

<p>Bám sát cấu trúc Bộ GD.</p>

<button>
Đang cập nhật
</button>

</div>

</div>

</div>

</body>
</html>
