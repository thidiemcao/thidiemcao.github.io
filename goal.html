<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Thiết lập mục tiêu</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f4f6fb;

}

header{

background:#0057ff;
color:white;
padding:20px;
text-align:center;

}

.container{

max-width:700px;
margin:40px auto;

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

h2{

margin-bottom:25px;

}

label{

display:block;
margin-top:20px;
font-weight:bold;

}

select{

width:100%;

padding:12px;

margin-top:10px;

font-size:17px;

border-radius:8px;

border:1px solid #ccc;

}

button{

margin-top:35px;

width:100%;

background:#0057ff;

color:white;

border:none;

padding:15px;

font-size:20px;

border-radius:10px;

cursor:pointer;

}

button:hover{

background:#0044cc;

}

</style>

</head>

<body>

<header>

<h1>🎯 Thiết lập mục tiêu</h1>

</header>

<div class="container">

<h2>

Em đang học lớp nào?

</h2>

<select id="grade">

<option value="">-- Chọn lớp --</option>

<option>9</option>

<option>10</option>

<option>11</option>

<option>12</option>

</select>

<label>

Mục tiêu

</label>

<select id="goal">

<option value="">

Hãy chọn lớp trước

</option>

</select>

<button id="saveBtn">

Lưu mục tiêu

</button>

</div>
