<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thiết lập mục tiêu</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f4f6fb;

}

header{

background:#0057ff;
color:white;
padding:25px;
text-align:center;

}

header h1{

font-size:32px;

}

.container{

max-width:700px;
margin:40px auto;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}

h2{

margin-bottom:25px;
color:#0057ff;

}

label{

display:block;
margin-top:22px;
font-weight:bold;
font-size:18px;

}

select{

width:100%;

padding:12px;

margin-top:10px;

font-size:17px;

border-radius:8px;

border:1px solid #ccc;

}

#goal{

height:220px;

}

#goal option{

padding:8px;

}

select:focus{

border-color:#0057ff;

}

button{

margin-top:35px;
width:100%;
padding:16px;
font-size:20px;
border:none;
border-radius:10px;
cursor:pointer;
background:#0057ff;
color:white;
transition:.3s;

}

button:hover{

background:#0044cc;

}

.info{

margin-top:25px;
padding:18px;
background:#eef5ff;
border-left:5px solid #0057ff;
border-radius:10px;

}

.info h3{

margin-bottom:10px;
color:#0057ff;

}

.info p{

line-height:1.6;

}

</style>

</head>

<body>

<header>

<h1>🎯 Thiết lập mục tiêu học tập</h1>

<p>
Hãy chọn mục tiêu để đồng hành cùng Thi ĐIỂM CAO
</p>

</header>

<div class="container">

<h2>

Mục tiêu của em

</h2>

<label>

Em đang học lớp

</label>

<select id="grade">

<option value="">

-- Chọn lớp --

</option>

<option value="9">

Lớp 9

</option>

<option value="10">

Lớp 10

</option>

<option value="11">

Lớp 11

</option>

<option value="12">

Lớp 12

</option>

</select>

<label>

Mục tiêu

</label>

<select id="goal" multiple size="8">

<option value="">
Hãy chọn lớp trước
</option>

</select>

<p style="margin-top:10px;color:#666;font-size:15px;">
💡 Giữ phím <b>Ctrl</b> (Windows) hoặc <b>Cmd</b> (Mac) để chọn nhiều mục tiêu cùng lúc.
</p>

Thiết lập mục tiêu sẽ giúp hệ thống theo dõi tiến độ học tập, chuỗi ngày học liên tiếp và huy hiệu của em.

</p>

</div>

<button id="saveBtn">

🚀 Lưu mục tiêu

</button>

</div>

<!-- Firebase -->

<script type="module" src="js/goal.js"></script>

</body>

</html>
