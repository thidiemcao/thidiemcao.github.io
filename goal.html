<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Thiết lập mục tiêu</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
<script>

const grade=document.getElementById("grade");

const goal=document.getElementById("goal");

grade.onchange=function(){

goal.innerHTML="";

if(grade.value=="9"){

goal.innerHTML=`

<option>Đỗ THPT Chuyên</option>

<option>Đỗ THPT công lập</option>

<option>Đỗ THPT Chuyên Lam Sơn</option>

<option>Đỗ THPT Chuyên KHTN</option>

<option>Đỗ THPT Chuyên Amsterdam</option>

<option>Đỗ THPT Chuyên Phan Bội Châu</option>

<option>Đỗ THPT Chuyên Lê Hồng Phong</option>

`;

}

if(grade.value=="10"){

goal.innerHTML=`

<option>Học sinh Xuất sắc</option>

<option>Điểm TB ≥ 9.0</option>

<option>Top 10 lớp</option>

<option>Top 5 lớp</option>

`;

}

if(grade.value=="11"){

goal.innerHTML=`

<option>Học sinh Xuất sắc</option>

<option>Điểm TB ≥ 9.2</option>

<option>Top 5 lớp</option>

<option>Chuẩn bị thi THPT</option>

`;

}

if(grade.value=="12"){

goal.innerHTML=`

<option>Đỗ Đại học Bách Khoa Hà Nội</option>

<option>Đỗ Đại học Y Hà Nội</option>

<option>Đỗ Đại học Ngoại thương</option>

<option>Đỗ Đại học Kinh tế Quốc dân</option>

<option>Đỗ Đại học Sư phạm Hà Nội</option>

<option>Đỗ Đại học Công nghệ - ĐHQGHN</option>

<option>Đỗ Học viện Kỹ thuật Quân sự</option>

<option>Đỗ Học viện An ninh</option>

<option>Đỗ Học viện Cảnh sát</option>

`;

}

};

document.getElementById("saveBtn").onclick=function(){

if(grade.value==""){

alert("Hãy chọn lớp.");

return;

}

localStorage.setItem("goalGrade",grade.value);

localStorage.setItem("goal",goal.value);

localStorage.setItem("goalPercent",0);

alert("🎉 Thiết lập mục tiêu thành công!");

location.href="index.html";

}

</script>

</body>

</html>
body{

background:#f4f6fb;

}

header{

background:#0057ff;
color:white;
padding:20px;
text-align:center;

}

.container{

max-width:700px;
margin:40px auto;

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

h2{

margin-bottom:25px;

}

label{

display:block;
margin-top:20px;
font-weight:bold;

}

select{

width:100%;

padding:12px;

margin-top:10px;

font-size:17px;

border-radius:8px;

border:1px solid #ccc;

}

button{

margin-top:35px;

width:100%;

background:#0057ff;

color:white;

border:none;

padding:15px;

font-size:20px;

border-radius:10px;

cursor:pointer;

}

button:hover{

background:#0044cc;

}

</style>

</head>
<script type="module" src="js/goal.js"></script>
<body>

<header>

<h1>🎯 Thiết lập mục tiêu</h1>

</header>

<div class="container">

<h2>

Em đang học lớp nào?

</h2>

<select id="grade">

<option value="">-- Chọn lớp --</option>

<option>9</option>

<option>10</option>

<option>11</option>

<option>12</option>

</select>

<label>

Mục tiêu

</label>

<select id="goal">

<option value="">

Hãy chọn lớp trước

</option>

</select>

<button id="saveBtn">

Lưu mục tiêu

</button>

</div>
